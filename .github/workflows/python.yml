name: Python

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'excalidraw-readme-diagrams/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'excalidraw-readme-diagrams/**'
      - '.github/workflows/python.yml'

jobs:
  excalidraw-readme-diagrams:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: excalidraw-readme-diagrams
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
