name: Zig

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mandelbrot/**'
      - '.gitmodules'
      - '.github/workflows/zig.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mandelbrot/**'
      - '.gitmodules'
      - '.github/workflows/zig.yml'

jobs:
  mandelbrot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mandelbrot
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.12.0
      - run: zig build test --summary all
      - run: zig build -Doptimize=ReleaseFast
