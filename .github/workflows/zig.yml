name: Zig

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mandelbrot/**'
      - '.github/workflows/zig.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mandelbrot/**'
      - '.github/workflows/zig.yml'

jobs:
  mandelbrot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mandelbrot
    steps:
      - uses: actions/checkout@v4
      - name: Read Zig version from build.zig.zon
        id: zig
        run: echo "version=$(sed -nE 's/.*minimum_zig_version = "([^"]+)".*/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - run: zig build test --summary all
      - run: zig build -Doptimize=ReleaseFast
